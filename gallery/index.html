<!doctype html>
<html><head>
<!-- Open Graph -->
<meta property="og:title" content="Sako | Gallery">
<meta property="og:description" content="A bunch of images. For no reason.">
<meta property="og:image" content="https://sakoshiv.github.io/media/sys/1x1.webp">
<meta property="og:url" content="https://sakoshiv.github.io/gallery/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<!-- General -->
<title>Sako | Gallery</title>
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#111111">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../media/sys/eyecon.ico" sizes="any">
<meta charset="utf-8">
<link rel="stylesheet" href="../code/css/style.css">
<link rel="preload" href="../code/js/header.js" as="script">
<link rel="preload" href="../code/js/tagline.js" as="script">
<style>
    .gallery-row {
        margin-top: 30px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        width: 100%;
    }

    .gallery-item {
        aspect-ratio: 3 / 4;
        overflow: hidden;
        min-width: 0;
        cursor: pointer;
        position: relative;
    }

    .gallery-item::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        opacity: 0;
        pointer-events: none;
    }

    .gallery-item:hover::after {
        opacity: 1;
    }

    .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    @media (max-width: 700px) {
        .gallery-row {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    @media (max-width: 420px) {
        .gallery-row {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    .lightbox-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }

    .lightbox-overlay.active {
        display: flex;
    }

    .lightbox-overlay img {
        max-width: 80vw;
        max-height: 85vh;
        object-fit: contain;
        cursor: default;
    }

    .lightbox-caption {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 7.5%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #d7d7d7;
        font-family: Segoe, "Segoe UI", "DejaVu Sans", "Trebuchet MS", Verdana, sans-serif;
        font-size: 14px;
        pointer-events: none;
    }

    .lightbox-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 28px;
        height: 28px;
        cursor: pointer;
        opacity: 0.3;
    }

    .lightbox-nav:hover {
        opacity: 1;
    }

    .lightbox-nav-left {
        left: 4%;
    }

    .lightbox-nav-right {
        right: 4%;
    }

    @media (max-width: 700px) {
        .lightbox-caption {
            display: none;
        }

        .lightbox-nav {
            display: none;
        }
    }

    .gallery-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .gallery-header p {
        margin-bottom: 0;
    }

    .gallery-toolbar {
        display: flex;
    }

    @media (max-width: 700px) {
        .gallery-toolbar {
            display: none;
        }
    }

    .filter-toggle {
        display: flex;
        align-items: center;
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
    }

    .filter-toggle img {
        width: 20px;
        height: 20px;
        opacity: 0.5;
    }

    .filter-toggle:hover img {
        opacity: 1;
    }

    .filter-wrapper {
        position: relative;
    }

    .tag-filter-panel {
        display: none;
        position: absolute;
        top: 0;
        left: calc(100% + 8px);
        width: 380px;
        background: #1a1a1a;
        border: 1px solid #333;
        z-index: 100;
        font-size: 14px;
        overflow: hidden;
    }

    @media (max-width: 700px) {
        .tag-filter-panel {
            top: calc(100% + 8px);
            left: auto;
            right: 0;
            max-width: calc(100vw - 24px);
        }
    }

    .tag-filter-panel.open {
        display: block;
    }

    .tag-filter-body {
        display: flex;
    }

    .tag-filter-groups {
        width: 150px;
        border-right: 1px solid #333;
        padding: 10px 0;
    }

    .tag-filter-group-label {
        padding: 4px 14px 10px;
        color: #7a7a7a;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
    }

    .tag-filter-group {
        display: flex;
        justify-content: space-between;
        padding: 6px 14px;
        cursor: pointer;
        color: #d7d7d7;
    }

    .tag-filter-group span {
        color: #7a7a7a;
    }

    .tag-filter-group:hover {
        background: #232323;
    }

    .tag-filter-group.active {
        background: #232323;
        color: #fff;
    }

    .tag-filter-items {
        flex: 1;
        padding: 10px 14px;
    }

    .tag-filter-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 0;
        cursor: pointer;
        color: #d7d7d7;
        user-select: none;
    }

    .tag-filter-checkbox {
        width: 15px;
        height: 15px;
        border: 1px solid #666;
        border-radius: 3px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        line-height: 1;
    }

    .tag-filter-item[data-state="include"] .tag-filter-checkbox {
        background: #8b8b8b;
        border-color: #8b8b8b;
        color: #fff;
    }

    .tag-filter-item[data-state="exclude"] .tag-filter-checkbox {
        background: #c0392b;
        border-color: #c0392b;
        color: #fff;
    }

    .tag-filter-footer {
        border-top: 1px solid #333;
        padding: 8px 14px;
        color: #7a7a7a;
        font-size: 12px;
        text-align: center;
        cursor: pointer;
    }

    .gallery-wrap {
        position: relative;
    }

    .text p.no-images-message {
        display: none;
        position: absolute;
        top: 30px;
        left: 0;
        right: 0;
        color: #A7A7A7;
        text-align: center;
        font-size: small;
    }
</style>
</head>

<body>

<div class="content">

    <div id="site-header"></div>
    <script src="../code/js/header.js"></script>
    <script src="../code/js/tagline.js"></script>

    <div class="text">

      <p2 class="breadcrumbs">
            » <a href="/gallery/" class="subtle-link">Gallery</a>
        </p2>

        <div class="gallery-header">
            <p>Shitposts and anime screenshots as placeholder media. A work in progress page.</p>

            <div class="gallery-toolbar">
                <div class="filter-wrapper">
                    <button class="filter-toggle" id="tagFilterToggle" aria-label="Filter by tag">
                        <img src="../media/sys/filter.svg" alt="">
                    </button>

                    <div class="tag-filter-panel" id="tagFilterPanel">
                        <div class="tag-filter-body">
                            <div class="tag-filter-groups">
                                <div class="tag-filter-group-label">Tag Groups</div>
                                <div class="tag-filter-group active" data-group="content">Content <span>3</span></div>
                                <div class="tag-filter-group" data-group="technical">Technical <span>2</span></div>
                            </div>
                            <div class="tag-filter-items" id="tagFilterItems"></div>
                        </div>
                        <div class="tag-filter-footer" id="tagFilterApply">Click boxes to cycle visiblity state. Then click here to apply filters.</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="gallery-wrap">
        <p id="noImagesMessage" class="no-images-message">There are no gallery entries being shown. Check the applied filters.</p>

        <div class="gallery-row">
            <div class="gallery-item"><img src="../media/img/thumb/screenshot-01166_thumb.webp" data-full="../media/img/screenshot-01166.webp" alt="" data-title="Would you stomp on her for 30 trillion dollars? I would." data-tags="Screenshot"></div>
          <div class="gallery-item"><img src="../media/img/thumb/damn_bro_thumb.webp" data-full="../media/img/damn_bro.webp" alt="" data-title="Dude Please Stop Talking" data-tags="Shitpost, Garupan"></div>
            <div class="gallery-item"><img src="../media/img/thumb/post-preview-02_thumb.webp" data-full="../media/img/post-preview-02.webp" alt="" data-title="Fucked up looking Nadeko." data-tags="Screenshot, Shitpost"></div>
            <div class="gallery-item"><img src="../media/img/thumb/mako_ride_thumb.gif" data-full="../media/img/mako_ride.gif" alt="" data-title="Mako Riding A Fuckin Horse Dot GIF" data-tags="Animated, Garupan"></div>
            <div class="gallery-item"><img src="../media/img/thumb/miho_lurk_thumb.webp" data-full="../media/img/miho_lurk.png" alt="" data-title="Creepy Low Res. Miho" data-tags="Shitpost, Garupan"></div>
            <div class="gallery-item"><img src="../media/img/thumb/bokodeath_thumb.gif" data-full="../media/img/bokodeath.gif" alt="" data-title="Total Boko Death" data-tags="Animated, Garupan"></div>
            <div class="gallery-item"><img src="../media/img/thumb/spinny_thumb.gif" data-full="../media/img/spinny.gif" alt="" data-title="Transparency Test" data-tags="Animated"></div>
            <div class="gallery-item"><img src="../media/img/thumb/huh_thumb.webp" data-full="../media/img/huh.png" alt="" data-title="What?" data-tags="Shitpost"></div>
            <div class="gallery-item"><img src="../media/img/thumb/neko_thumb.gif" data-full="../media/img/neko.gif" alt="" data-title="God I Wish That Were Me" data-tags="Animated"></div>
            <div class="gallery-item"><img src="../media/img/thumb/neet_thumb.webp" data-full="../media/img/neet.jpg" alt="" data-title="I'm running out of unique placeholder media." data-tags="Shitpost"></div>
            <div class="gallery-item"><img src="../media/img/thumb/dont_thumb.webp" data-full="../media/img/dont.jpg" alt="" data-title="Avoid alcohol and drugs." data-tags="Shitpost, NSFW"></div>
        </div>
        </div>

        <p></p>

  </div>
</div>

<div class="lightbox-overlay" id="lightbox">
    <img class="lightbox-nav lightbox-nav-left" id="lightbox-prev" src="../media/sys/left.svg" alt="Previous">
    <img id="lightbox-img" src="" alt="">
    <img class="lightbox-nav lightbox-nav-right" id="lightbox-next" src="../media/sys/right.svg" alt="Next">
    <div class="lightbox-caption" id="lightbox-caption"></div>
</div>

<script>
    (function () {
        const groups = {
            "content": ["Screenshot", "Shitpost", "Garupan"],
            "technical": ["NSFW", "Animated"],
        };

        const state = {}; // tag label -> "include" | "exclude" (absence = neutral)

        const toggleBtn = document.getElementById("tagFilterToggle");
        const panel = document.getElementById("tagFilterPanel");
        const itemsEl = document.getElementById("tagFilterItems");
        const applyBtn = document.getElementById("tagFilterApply");
        const groupEls = document.querySelectorAll(".tag-filter-group");
        const galleryItemEls = document.querySelectorAll(".gallery-item");
        const noImagesMsg = document.getElementById("noImagesMessage");

        function nextState(current) {
            if (current === "include") return "exclude";
            if (current === "exclude") return undefined;
            return "include";
        }

        function applyFilters() {
            const includeTags = Object.keys(state).filter((t) => state[t] === "include");
            const excludeTags = Object.keys(state).filter((t) => state[t] === "exclude");

            galleryItemEls.forEach((item) => {
                const img = item.querySelector("img[data-tags]");
                const tags = img.dataset.tags.split(",").map((t) => t.trim());

                const isExcluded = excludeTags.some((t) => tags.includes(t));
                const matchesInclude = includeTags.length === 0 || includeTags.some((t) => tags.includes(t));

                item.style.display = (!isExcluded && matchesInclude) ? "" : "none";
            });

            const anyVisible = Array.from(galleryItemEls).some((item) => item.style.display !== "none");
            noImagesMsg.style.display = anyVisible ? "none" : "block";
        }

        function renderItems(groupKey) {
            itemsEl.innerHTML = "";
            groups[groupKey].forEach((label) => {
                const row = document.createElement("div");
                row.className = "tag-filter-item";
                row.dataset.state = state[label] || "neutral";

                const box = document.createElement("span");
                box.className = "tag-filter-checkbox";
                box.textContent = state[label] === "include" ? "✓" : state[label] === "exclude" ? "✕" : "";

                const text = document.createElement("span");
                text.textContent = label;

                row.appendChild(box);
                row.appendChild(text);

                row.addEventListener("click", (e) => {
                    e.stopPropagation();
                    state[label] = nextState(state[label]);
                    renderItems(groupKey);
                });

                itemsEl.appendChild(row);
            });
        }

        groupEls.forEach((el) => {
            el.addEventListener("click", () => {
                groupEls.forEach((g) => g.classList.remove("active"));
                el.classList.add("active");
                renderItems(el.dataset.group);
            });
        });

        toggleBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            panel.classList.toggle("open");
        });

        applyBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            applyFilters();
        });

        document.addEventListener("click", (e) => {
            if (!panel.contains(e.target) && e.target !== toggleBtn) {
                panel.classList.remove("open");
            }
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                panel.classList.remove("open");
            }
        });

        renderItems("content");
    })();
</script>

<script>
    (function () {
        const items = Array.from(document.querySelectorAll('.gallery-item img'));
        const overlay = document.getElementById('lightbox');
        const overlayImg = document.getElementById('lightbox-img');
        const caption = document.getElementById('lightbox-caption');
        const prevBtn = document.getElementById('lightbox-prev');
        const nextBtn = document.getElementById('lightbox-next');
        let currentImg = null;

        function getVisibleItems() {
            return items.filter((img) => img.closest('.gallery-item').style.display !== 'none');
        }

        function show(img) {
            currentImg = img;
            overlayImg.src = img.dataset.full;
            caption.textContent = img.dataset.title || '';
            overlay.classList.add('active');
        }

        function step(delta) {
            const visible = getVisibleItems();
            if (visible.length === 0) return;
            let idx = visible.indexOf(currentImg);
            if (idx === -1) idx = 0;
            idx = (idx + delta + visible.length) % visible.length;
            show(visible[idx]);
        }

        function close() {
            overlay.classList.remove('active');
            overlayImg.src = '';
            caption.textContent = '';
        }

        items.forEach((img) => {
            img.addEventListener('click', () => show(img));
        });

        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            step(-1);
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            step(1);
        });

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) close();
        });

        document.addEventListener('keydown', (e) => {
            if (!overlay.classList.contains('active')) return;
            if (e.key === 'ArrowRight') step(1);
            else if (e.key === 'ArrowLeft') step(-1);
            else if (e.key === 'Escape') close();
        });
    })();
</script>

</body>
</html>
