<style>
    .gallery-row {
        margin-top: 30px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        width: 100%;
    }

    .gallery-item {
        aspect-ratio: 3 / 4;
        overflow: hidden;
        min-width: 0;
        cursor: pointer;
        position: relative;
    }

    .gallery-item::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        opacity: 0;
        pointer-events: none;
    }

    .gallery-item:hover::after {
        opacity: 1;
    }

    .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    @media (max-width: 700px) {
        .gallery-row {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    @media (max-width: 420px) {
        .gallery-row {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    .lightbox-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }

    .lightbox-overlay.active {
        display: flex;
    }

    .lightbox-overlay img {
        max-width: 80vw;
        max-height: 85vh;
        object-fit: contain;
        cursor: default;
    }

    .lightbox-caption {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 7.5%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #d7d7d7;
        font-family: Segoe, "Segoe UI", "DejaVu Sans", "Trebuchet MS", Verdana, sans-serif;
        font-size: 14px;
        pointer-events: none;
    }

    .lightbox-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 28px;
        height: 28px;
        cursor: pointer;
        opacity: 0.3;
    }

    .lightbox-nav:hover {
        opacity: 1;
    }

    .lightbox-nav-left {
        left: 4%;
    }

    .lightbox-nav-right {
        right: 4%;
    }

    @media (max-width: 700px) {
        .lightbox-caption {
            display: none;
        }

        .lightbox-nav {
            display: none;
        }
    }
</style>
</head>

<body>

<div class="content">

    <div class="text">

<div class="lightbox-overlay" id="lightbox">
    <img class="lightbox-nav lightbox-nav-left" id="lightbox-prev" src="../media/sys/left.svg" alt="Previous">
    <img id="lightbox-img" src="" alt="">
    <img class="lightbox-nav lightbox-nav-right" id="lightbox-next" src="../media/sys/right.svg" alt="Next">
    <div class="lightbox-caption" id="lightbox-caption"></div>
</div>

<script>
    (function () {
        const items = Array.from(document.querySelectorAll('.gallery-item img'));
        const overlay = document.getElementById('lightbox');
        const overlayImg = document.getElementById('lightbox-img');
        const caption = document.getElementById('lightbox-caption');
        const prevBtn = document.getElementById('lightbox-prev');
        const nextBtn = document.getElementById('lightbox-next');
        let currentIndex = 0;

        function show(index) {
            currentIndex = (index + items.length) % items.length;
            overlayImg.src = items[currentIndex].dataset.full;
            caption.textContent = items[currentIndex].dataset.title || '';
            overlay.classList.add('active');
        }

        function close() {
            overlay.classList.remove('active');
            overlayImg.src = '';
            caption.textContent = '';
        }

        items.forEach((img, index) => {
            img.addEventListener('click', () => show(index));
        });

        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            show(currentIndex - 1);
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            show(currentIndex + 1);
        });

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) close();
        });

        document.addEventListener('keydown', (e) => {
            if (!overlay.classList.contains('active')) return;
            if (e.key === 'ArrowRight') show(currentIndex + 1);
            else if (e.key === 'ArrowLeft') show(currentIndex - 1);
            else if (e.key === 'Escape') close();
        });
    })();
</script>
