<script>
    (function () {
        const groups = {
            "content": ["Screenshot", "Shitpost", "Garupan"],
            "technical": ["NSFW", "Animated"],
            "years": ["2026"],
            "months": ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
            "quarters": ["Q1", "Q2", "Q3", "Q4"],
        };

        const state = {}; // tag label -> "include" | "exclude" (absence = neutral)

        const toggleBtn = document.getElementById("tagFilterToggle");
        const panel = document.getElementById("tagFilterPanel");
        const itemsEl = document.getElementById("tagFilterItems");
        const applyBtn = document.getElementById("tagFilterApply");
        const groupEls = document.querySelectorAll(".tag-filter-group");
        const galleryItemEls = document.querySelectorAll(".gallery-item");
        const noImagesMsg = document.getElementById("noImagesMessage");

        function nextState(current) {
            if (current === "include") return "exclude";
            if (current === "exclude") return undefined;
            return "include";
        }

        function applyFilters() {
            const includeTags = Object.keys(state).filter((t) => state[t] === "include");
            const excludeTags = Object.keys(state).filter((t) => state[t] === "exclude");

            galleryItemEls.forEach((item) => {
                const img = item.querySelector("img[data-tags]");
                const tags = img.dataset.tags.split(",").map((t) => t.trim());

                const isExcluded = excludeTags.some((t) => tags.includes(t));
                const matchesInclude = includeTags.length === 0 || includeTags.some((t) => tags.includes(t));

                item.style.display = (!isExcluded && matchesInclude) ? "" : "none";
            });

            const anyVisible = Array.from(galleryItemEls).some((item) => item.style.display !== "none");
            noImagesMsg.style.display = anyVisible ? "none" : "block";
        }

        function countForTag(label) {
            return Array.from(galleryItemEls).filter((item) => {
                const img = item.querySelector("img[data-tags]");
                const tags = img.dataset.tags.split(",").map((t) => t.trim());
                return tags.includes(label);
            }).length;
        }

        function renderItems(groupKey) {
            itemsEl.innerHTML = "";
            groups[groupKey].forEach((label) => {
                const row = document.createElement("div");
                row.className = "tag-filter-item";
                row.dataset.state = state[label] || "neutral";

                const box = document.createElement("span");
                box.className = "tag-filter-checkbox";
                box.textContent = state[label] === "include" ? "✓" : state[label] === "exclude" ? "✕" : "";

                const text = document.createElement("span");
                text.className = "tag-filter-item-label";
                text.textContent = label;

                const count = document.createElement("span");
                count.className = "tag-filter-count";
                count.textContent = countForTag(label);

                row.appendChild(box);
                row.appendChild(text);
                row.appendChild(count);

                row.addEventListener("click", (e) => {
                    e.stopPropagation();
                    state[label] = nextState(state[label]);
                    renderItems(groupKey);
                });

                itemsEl.appendChild(row);
            });
        }

        groupEls.forEach((el) => {
            el.addEventListener("click", () => {
                groupEls.forEach((g) => g.classList.remove("active"));
                el.classList.add("active");
                renderItems(el.dataset.group);
            });
        });

        toggleBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            panel.classList.toggle("open");
        });

        applyBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            applyFilters();
        });

        document.addEventListener("click", (e) => {
            if (!panel.contains(e.target) && e.target !== toggleBtn) {
                panel.classList.remove("open");
            }
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                panel.classList.remove("open");
            }
        });

        function applyFromURL() {
            const params = new URLSearchParams(window.location.search);
            const tag = params.get("tag");
            if (!tag) return;

            state[tag] = "include";

            const groupKey = Object.keys(groups).find((g) => groups[g].includes(tag));
            if (groupKey) {
                groupEls.forEach((g) => g.classList.toggle("active", g.dataset.group === groupKey));
                renderItems(groupKey);
            }

            applyFilters();
        }

        renderItems("content");
        applyFromURL();
    })();
</script>

<script>
    (function () {
        const items = Array.from(document.querySelectorAll('.gallery-item img'));
        const overlay = document.getElementById('lightbox');
        const overlayImg = document.getElementById('lightbox-img');
        const titleEl = document.getElementById('lightbox-title');
        const fullLinkEl = document.getElementById('lightbox-full-link');
        const metaEl = document.getElementById('lightbox-meta');
        const counterEl = document.getElementById('lightbox-counter');
        const thumbsEl = document.getElementById('lightbox-thumbs');
        const thumbsTrackEl = document.getElementById('lightbox-thumbs-track');
        const prevBtn = document.getElementById('lightbox-prev');
        const nextBtn = document.getElementById('lightbox-next');
        let currentImg = null;

        function getVisibleItems() {
            return items.filter((img) => img.closest('.gallery-item').style.display !== 'none');
        }

        function pad(n) {
            return String(n).padStart(2, '0');
        }

        function renderThumbs() {
            const visible = getVisibleItems();
            thumbsTrackEl.innerHTML = '';
            let activeEl = null;

            visible.forEach((img) => {
                const thumb = document.createElement('div');
                thumb.className = 'lightbox-thumb' + (img === currentImg ? ' active' : '');

                const frame = document.createElement('div');
                frame.className = 'lightbox-thumb-frame';
                const thumbImg = document.createElement('img');
                thumbImg.src = img.src;
                thumbImg.alt = '';
                frame.appendChild(thumbImg);

                const bar = document.createElement('div');
                bar.className = 'lightbox-thumb-bar';

                thumb.appendChild(frame);
                thumb.appendChild(bar);
                thumb.addEventListener('click', () => show(img));
                thumbsTrackEl.appendChild(thumb);

                if (img === currentImg) activeEl = thumb;
            });

            centerThumbs(activeEl);
        }

        function centerThumbs(activeEl) {
            const wrapperWidth = thumbsEl.clientWidth;
            const trackWidth = thumbsTrackEl.scrollWidth;

            let offset;
            let atStart = true;
            let atEnd = true;

            if (trackWidth <= wrapperWidth) {
                offset = (wrapperWidth - trackWidth) / 2;
            } else {
                const activeCenter = activeEl ? activeEl.offsetLeft + activeEl.offsetWidth / 2 : trackWidth / 2;
                const minOffset = wrapperWidth - trackWidth;
                offset = Math.min(0, Math.max(minOffset, wrapperWidth / 2 - activeCenter));
                atStart = offset >= -0.5;
                atEnd = offset <= minOffset + 0.5;
            }

            thumbsTrackEl.style.transform = `translateX(${offset}px)`;

            const stops = [];
            stops.push(atStart ? 'black 0%' : 'rgba(0, 0, 0, 0.5) 0%, black 60px');
            stops.push(atEnd ? 'black 100%' : 'black calc(100% - 60px), rgba(0, 0, 0, 0.5) 100%');
            const mask = `linear-gradient(to right, ${stops.join(', ')})`;
            thumbsEl.style.maskImage = mask;
            thumbsEl.style.webkitMaskImage = mask;
        }

        function slugify(title) {
            return title.replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function tagLink(label) {
            return `<a href="/gallery/?tag=${encodeURIComponent(label)}" class="subtle-link">${escapeHtml(label)}</a>`;
        }

        const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

        function isMetaOnlyTag(tag) {
            return MONTHS.includes(tag) || /^\d{4}$/.test(tag) || /^Q[1-4]$/.test(tag);
        }

        function show(img) {
            currentImg = img;
            overlayImg.src = img.dataset.full;
            titleEl.textContent = img.dataset.title || '';

            const tags = (img.dataset.tags || '').split(',').map((t) => t.trim()).filter(Boolean);
            const displayTags = tags.filter((t) => !isMetaOnlyTag(t));
            const date = img.dataset.date || '';
            const dateMatch = date.match(/^([A-Za-z]+)\s+(\d+),\s+(\d+)$/);

            function baseMetaHTML(dims) {
                let dateHTML = escapeHtml(date);
                if (dateMatch) {
                    const [, month, day, year] = dateMatch;
                    dateHTML = `${tagLink(month)} ${escapeHtml(day)}, ${tagLink(year)}`;
                }
                const tagsHTML = displayTags.map(tagLink).join(' / ');
                const rightSide = [tagsHTML, dims ? escapeHtml(dims) : ''].filter(Boolean).join(' / ');
                const parts = [dateHTML, rightSide].filter(Boolean);
                return parts.join(' - ');
            }

            // Render immediately with no dimensions so the header never waits on
            // image load (avoids layout shift and stale text during fast cycling).
            metaEl.innerHTML = baseMetaHTML('');

            const entrySlug = slugify(img.dataset.title || '');
            fullLinkEl.href = `/gallery/entry/?entry=${encodeURIComponent(entrySlug)}`;

            const staticRes = img.dataset.resolution || '';
            if (staticRes) {
                // Resolution is baked in per-item at import time (Site Content
                // Manager) — no live measurement, so it can never bleed the
                // previous image's dimensions onto this one during fast nav.
                metaEl.innerHTML = baseMetaHTML(staticRes.replace('x', ' x '));
            } else {
                // Fallback for items added before resolution was stored statically.
                function applyDims() {
                    if (currentImg !== img) return; // a newer show() call has since taken over
                    if (overlayImg.naturalWidth && overlayImg.naturalHeight) {
                        metaEl.innerHTML = baseMetaHTML(`${overlayImg.naturalWidth} x ${overlayImg.naturalHeight}`);
                        return true;
                    }
                    return false;
                }

                if (!applyDims()) {
                    overlayImg.addEventListener('load', applyDims, { once: true });
                }
            }

            const visible = getVisibleItems();
            const idx = visible.indexOf(img);
            counterEl.textContent = `${pad(idx + 1)}/${pad(visible.length)}`;

            overlay.classList.add('active');
            renderThumbs();
        }

        function step(delta) {
            const visible = getVisibleItems();
            if (visible.length === 0) return;
            let idx = visible.indexOf(currentImg);
            if (idx === -1) idx = 0;
            idx = (idx + delta + visible.length) % visible.length;
            show(visible[idx]);
        }

        function close() {
            overlay.classList.remove('active');
            overlayImg.src = '';
            titleEl.textContent = '';
            metaEl.textContent = '';
            counterEl.textContent = '';
            thumbsTrackEl.innerHTML = '';
            fullLinkEl.href = '/gallery/entry/';
        }

        items.forEach((img) => {
            img.addEventListener('click', () => show(img));
        });

        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            step(-1);
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            step(1);
        });

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) close();
        });

        document.addEventListener('keydown', (e) => {
            if (!overlay.classList.contains('active')) return;
            if (e.key === 'ArrowRight') step(1);
            else if (e.key === 'ArrowLeft') step(-1);
            else if (e.key === 'Escape') close();
        });

        window.addEventListener('resize', () => {
            if (!overlay.classList.contains('active')) return;
            const activeEl = thumbsTrackEl.querySelector('.lightbox-thumb.active');
            centerThumbs(activeEl);
        });
    })();
</script>

</body>
</html>
