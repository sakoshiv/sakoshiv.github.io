            const notFoundEl = document.getElementById("entry-not-found");
            const contentEl = document.getElementById("entry-content");

            const params = new URLSearchParams(window.location.search);
            const slug = params.get("entry");
            const data = slug ? entries[slug] : null;

            if (!data) {
                notFoundEl.style.display = "";
                contentEl.style.display = "none";
                return;
            }

            notFoundEl.style.display = "none";
            contentEl.style.display = "";

            document.title = "Sako | " + data.title;

            document.getElementById("entry-title").textContent = data.title;
            document.getElementById("entry-image").src = data.image;
            document.getElementById("entry-description").textContent = data.description;

            document.getElementById("entry-meta-date").textContent = data.date;
            document.getElementById("entry-meta-project-time").textContent = data.projectTime || "";

            const resolutionEl = document.getElementById("entry-meta-resolution");
            const imageEl = document.getElementById("entry-image");

            function applyResolution() {
                if (imageEl.naturalWidth && imageEl.naturalHeight) {
                    resolutionEl.textContent = `${imageEl.naturalWidth}x${imageEl.naturalHeight}`;
                    return true;
                }
                return false;
            }

            if (!applyResolution()) {
                imageEl.addEventListener("load", applyResolution, { once: true });
            }

            const tagsEl = document.getElementById("entry-tags");
            tagsEl.dataset.tags = data.tags.join(", ");
            tagsEl.innerHTML = "Tags: ";
            data.tags.forEach((tag, i) => {
                if (i > 0) tagsEl.appendChild(document.createTextNode(" "));
                const a = document.createElement("a");
                a.href = "/gallery/?tag=" + encodeURIComponent(tag);
                a.className = "tag-chip";
                a.textContent = tag;
                tagsEl.appendChild(a);
            });
