<!doctype html>
<html><head>
<!-- Open Graph -->
<meta property="og:title" content="Sako | Gallery Entry">
<meta property="og:description" content="View gallery entries here.">
<meta property="og:image" content="https://sakoshiv.github.io/media/sys/1x1.webp">
<meta property="og:url" content="https://sakoshiv.github.io/gallery/entry/">
<meta property="og:type" content="website">
<meta name="twitter:title" content="Sako | Gallery Entry">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="675">
<!-- General -->
<title>Sako | Gallery Entry</title>
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#111111">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../../media/sys/eyecon.ico" sizes="any">
<meta charset="utf-8">
    <link rel="stylesheet" href="../../code/css/style.css">
<link rel="preload" href="../../code/js/header.js" as="script">
<link rel="preload" href="../../code/js/tagline.js" as="script">
<style>
    .post-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
        font-size: small;
    }

    .post-footer-tags {
        margin: 0;
        color: #A7A7A7;
    }

    .tag-chip {
        display: inline-block;
        background: #1d2f42;
        color: #7bb0e8;
        border-radius: 6px;
        padding: 4px 12px;
        margin-left: 2px;
        font-size: 12px;
        text-decoration: none;
    }

    .tag-chip,
    .tag-chip:link,
    .tag-chip:visited,
    .tag-chip:hover,
    .tag-chip:active {
        color: #7bb0e8;
    }

    .tag-chip:hover {
        background: #24405a;
    }

    .post-footer-top {
        display: flex;
        align-items: center;
    }

    @media (max-width: 700px) {
        .post-footer-tags {
            display: none;
        }

        .post-footer {
            justify-content: flex-end;
        }
    }

    .entry-not-found {
        margin-top: 100px;
        color: #A7A7A7;
        text-align: center;
        font-size: small;
    }
</style>
</head>

<body>

<div class="content">

    <div id="site-header"></div>
    <script src="../../code/js/header.js"></script>
    <script src="../../code/js/tagline.js"></script>

    <div class="text">

        <p2 class="breadcrumbs">
            » <a href="/" class="subtle-link">Home</a>
            » <a href="/gallery/" class="subtle-link">Gallery</a>
            » Entry</a>
        </p2>

        <p id="entry-not-found" class="entry-not-found" style="display: none; font-size: small;">I think you broke some shit. Oh well.</p>

        <div id="entry-content" style="display: none;">

            <div class="post-header">
                <h6 id="entry-title"></h6>
                <span class="post-date" id="entry-date"></span>
            </div>
            <div class="mediaC">

                  <img src="" alt="" class="mediaA" id="entry-image">
                  </div>

            <p id="entry-description"></p>
            <hr>
            <div class="post-footer">
              <p class="post-footer-tags" id="entry-tags">Tags: </p>
                <a href="#" class="post-footer-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;" aria-label="Back to top">
                    <img src="../../media/sys/top.svg" alt="" width="16" height="16">
                </a>
            </div>

        </div>
</div>
</div>

    <script src="../../code/js/site.js"></script>
    <script>
        (function () {
            // Each entry's slug is derived the same way the gallery lightbox
            // builds its "View Full Entry" link: title with punctuation
            // stripped and spaces turned into hyphens.
            const entries = {
                "Captured-Kishirika": {
                    title: "Captured Kishirika",
                    date: "09.07.2026",
                    image: "../../media/img/screenshot-01166.webp",
                    tags: ["September", "2026", "Q3", "Screenshot", "Shitpost"],
                    description: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Quis ipsum suspendisse ultrices gravida. Risus commodo viverra maecenas accumsan lacus vel facilisis. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua."
                },
                "Avoid-alcohol-and-drugs": {
                    title: "Avoid alcohol and drugs.",
                    date: "06.25.2026",
                    image: "../../media/img/dont.jpg",
                    tags: ["June", "2026", "Q2", "Shitpost", "NSFW"],
                    description: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. This is placeholder writeup text standing in for a real entry description. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua."
                }
            };

            const notFoundEl = document.getElementById("entry-not-found");
            const contentEl = document.getElementById("entry-content");

            const params = new URLSearchParams(window.location.search);
            const slug = params.get("entry");
            const data = slug ? entries[slug] : null;

            if (!data) {
                notFoundEl.style.display = "";
                contentEl.style.display = "none";
                return;
            }

            notFoundEl.style.display = "none";
            contentEl.style.display = "";

            document.title = "Sako | " + data.title;

            document.getElementById("entry-title").textContent = data.title;
            document.getElementById("entry-date").textContent = data.date;
            document.getElementById("entry-image").src = data.image;
            document.getElementById("entry-description").textContent = data.description;

            const tagsEl = document.getElementById("entry-tags");
            tagsEl.dataset.tags = data.tags.join(", ");
            tagsEl.innerHTML = "Tags: ";
            data.tags.forEach((tag, i) => {
                if (i > 0) tagsEl.appendChild(document.createTextNode(" "));
                const a = document.createElement("a");
                a.href = "/gallery/?tag=" + encodeURIComponent(tag);
                a.className = "tag-chip";
                a.textContent = tag;
                tagsEl.appendChild(a);
            });
        })();
    </script>
</body>
</html>
