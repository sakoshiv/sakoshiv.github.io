<style>
    .home-grid {
        display: flex;
        flex-wrap: nowrap;
        gap: 12px;
        margin-top: 20px;
    }

    .home-col-media {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 0 1 25%;
        min-width: 160px;
    }

    .home-col-text {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1 1 75%;
        min-width: 300px;
    }

    .home-card {
        background: #151515;
        border: 1px solid #333;
        padding: 10px;
    }

    .home-card p.home-card-title {
    color: #d7d7d7;
    font-size: 14px;
    letter-spacing: 0.03em;
    margin: 0 0 10px;
    padding-bottom: 10px;
    padding-left: 4px;
    border-bottom: 1px solid #333;
    font-family: Segoe, "Segoe UI", "DejaVu Sans", "Trebuchet MS", Verdana, sans-serif;
    font-weight: bold;
    }

    .home-card p {
    margin: 0;
    color: #d7d7d7;
    font-size: small;
    padding-left: 4px;
    }

    .home-card .mediaComment {
    padding-left: 0;
    }

    .home-gallery-preview {
        position: relative;
        cursor: pointer;
        aspect-ratio: 3 / 4;
        overflow: hidden;
        max-width: 145px;
        margin: 0 auto;
    }

    .home-gallery-preview::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        opacity: 0;
        pointer-events: none;
    }

    .home-gallery-preview:hover::after {
        opacity: 1;
    }

    .home-gallery-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .home-card .mediaC {
        margin-top: 10px;
    }

    .home-card .mediaComment {
        margin: 8px 0 0;
    }

    @media (max-width: 700px) {
        .home-grid {
            flex-direction: column;
        }

        .home-col-media,
        .home-col-text {
            display: contents;
        }

        .card-latest-post {
            order: 1;
        }

        .card-look-at-this {
            order: 2;
        }

        .card-brief-update {
            order: 3;
        }

        .card-gallery-entry {
            order: 4;
        }

        .home-gallery-preview {
            max-width: none;
        }
    }

    .lightbox-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 30px 20px;
    }

    .lightbox-overlay.active {
        display: flex;
    }

    .lightbox-content {
        width: min(94vw, 1600px, 120vh);
        max-height: 100%;
        display: flex;
        flex-direction: column;
        cursor: default;
        box-sizing: border-box;
    }

    .lightbox-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        width: 100%;
        box-sizing: border-box;
        color: #d7d7d7;
        font-family: Segoe, "Segoe UI", "DejaVu Sans", "Trebuchet MS", Verdana, sans-serif;
        margin-bottom: 14px;
    }

    .lightbox-header-left,
    .lightbox-header-right {
        display: flex;
        flex-direction: column;
    }

    .lightbox-header-right {
        align-items: flex-end;
        justify-content: flex-end;
    }

    .lightbox-title {
        font-size: 26px;
        font-weight: bold;
        color: #fff;
        margin: 0 0 4px;
    }

    .lightbox-meta {
        font-size: 13px;
        color: #8a8a8a;
        margin: 0;
    }

    .lightbox-meta a,
    .lightbox-meta a:link,
    .lightbox-meta a:visited,
    .lightbox-meta a:hover,
    .lightbox-meta a:active {
        color: inherit;
    }

    .lightbox-meta a:hover {
        text-decoration: underline;
    }

    @media (max-width: 700px) {
        .lightbox-meta {
            display: none;
        }
    }

    .lightbox-full-link {
        font-size: 13px;
        color: #8a8a8a;
        white-space: nowrap;
        margin: 0;
    }

    .lightbox-full-link a {
        color: #8a8a8a;
    }

    .lightbox-full-link a:hover {
        color: #d7d7d7;
        text-decoration: underline;
    }

    .lightbox-body {
        position: relative;
        width: 100%;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .lightbox-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .lightbox-frame img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        cursor: default;
        display: block;
    }
</style>

<div class="content">

    <div id="site-header"></div>
    <script src="code/js/header.js"></script>
    <script src="code/js/tagline.js"></script>

    <div class="text">

      <p2 class="breadcrumbs">
            » <a href="/" class="subtle-link">Home</a>
        </p2>

        <div class="home-grid">
            <div class="home-col-text">
                <div class="home-card card-latest-post">
                    <p class="home-card-title">Latest In Posts</p>
                    <p><a href="/posts/newest/">Newest</a> » Latest post for testing automated scripts and images for embeds.</p>
              </div>

                <div class="home-card card-look-at-this">
                    <p class="home-card-title">Very Important Image</p>
                    <div class="mediaC">
                        <img id="random-gif" src="media/img/neko.gif" alt="" class="mediaA">
                        <p id="random-text" class="mediaComment">&nbsp;</p>
                    </div>
                </div>
            </div>

            <div class="home-col-media">
                <div class="home-card card-gallery-entry">
                    <p class="home-card-title">Latest In Gallery</p>
                    <div class="home-gallery-preview" id="homeGalleryPreview" data-full="/media/img/20241207_163730.webp" data-title="LowRes Misaki" data-tags="Screenshot" data-date="September 12, 2026" data-entry="LowRes-Misaki">
                        <img src="/media/img/thumb/20241207_163730.webp" alt="">
                    </div>
                </div>

                <div class="home-card card-brief-update">
                    <p class="home-card-title">Quick Update</p>
                    <p>Everything is starting to look exactly how I want it. Not quite yet though.</p>
                </div>
            </div>
        </div>

        <p></p>

  </div>
</div>

<div class="lightbox-overlay" id="homeLightbox">
    <div class="lightbox-content">
        <div class="lightbox-header">
            <div class="lightbox-header-left">
                <p class="lightbox-title" id="homeLightboxTitle"></p>
                <p class="lightbox-meta" id="homeLightboxMeta"></p>
            </div>
            <div class="lightbox-header-right">
                <p class="lightbox-full-link"><a href="/gallery/entry/" id="homeLightboxFullLink">View Full Entry</a></p>
            </div>
        </div>
        <div class="lightbox-body">
            <div class="lightbox-frame">
                <img id="homeLightboxImg" src="" alt="">
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        const trigger = document.getElementById('homeGalleryPreview');
        const overlay = document.getElementById('homeLightbox');
        const img = document.getElementById('homeLightboxImg');
        const titleEl = document.getElementById('homeLightboxTitle');
        const metaEl = document.getElementById('homeLightboxMeta');
        const fullLinkEl = document.getElementById('homeLightboxFullLink');

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function tagLink(label) {
            return `<a href="/gallery/?tag=${encodeURIComponent(label)}" class="subtle-link">${escapeHtml(label)}</a>`;
        }

        function open() {
            img.src = trigger.dataset.full;
            titleEl.textContent = trigger.dataset.title || '';

            const tags = (trigger.dataset.tags || '').split(',').map((t) => t.trim()).filter(Boolean);
            const date = trigger.dataset.date || '';
            const dateMatch = date.match(/^([A-Za-z]+)\s+(\d+),\s+(\d+)$/);

            function baseMetaHTML(dims) {
                let dateHTML = escapeHtml(date);
                if (dateMatch) {
                    const [, month, day, year] = dateMatch;
                    dateHTML = `${tagLink(month)} ${escapeHtml(day)}, ${tagLink(year)}`;
                }
                const tagsHTML = tags.map(tagLink).join(' / ');
                const rightSide = [tagsHTML, dims ? escapeHtml(dims) : ''].filter(Boolean).join(' / ');
                const parts = [dateHTML, rightSide].filter(Boolean);
                return parts.join(' - ');
            }

            metaEl.innerHTML = baseMetaHTML('');

            const entrySlug = trigger.dataset.entry || '';
            fullLinkEl.href = `/gallery/entry/?entry=${encodeURIComponent(entrySlug)}`;

            function applyDims() {
                if (img.naturalWidth && img.naturalHeight) {
                    metaEl.innerHTML = baseMetaHTML(`${img.naturalWidth} x ${img.naturalHeight}`);
                    return true;
                }
                return false;
            }

            if (!applyDims()) {
                img.addEventListener('load', applyDims, { once: true });
            }

            overlay.classList.add('active');
        }

        function close() {
            overlay.classList.remove('active');
            img.src = '';
            titleEl.textContent = '';
            metaEl.textContent = '';
        }

        trigger.addEventListener('click', open);

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) close();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') close();
        });
    })();
</script>
